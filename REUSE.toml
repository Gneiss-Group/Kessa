version = 1

# Bulk license annotations for non-source files (REUSE spec). Go source files
# carry their own SPDX headers.
#
# The root LICENSE file is the AGPL-3.0-only text governing everything not
# otherwise marked; the per-tier texts live in LICENSES/ per the REUSE layout.

[[annotations]]
path = [
  "README.md",
  "LICENSING.md",
  "PLUGIN_LICENSING.md",
  "CLA.md",
  "UPCOMING.md",
  ".claude/CLAUDE.md",
  "Makefile",
  ".gitignore",
  "go.mod",
  "REUSE.toml",
  # docs/ is named file by file rather than by a `docs/*.md` glob. The glob was
  # wrong for one file (enrollment.md is AGPL-tier, see the block below) and it
  # was wrong SILENTLY, because a blanket claim over a directory quietly extends
  # itself to every file added later. Listing them is safe here specifically
  # because scripts/reusecheck fails on a tracked file that no statement covers:
  # a doc added without a licence is a build failure, not a silent Apache-2.0
  # grant nobody decided to make.
  "docs/README.md",
  "docs/branching.md",
  "docs/daemon.md",
  "docs/demo.md",
  "docs/enclave-runbook.md",
  "docs/go-standards.md",
  "docs/how-it-works.md",
  "docs/security-review.md",
  "docs/signer.md",
  "docs/stories.md",
  "docs/demo.tape",
  "docs/assets/**",
  "internal/policy/README.md",
  "cmd/shadow/README.md",
  "examples/**",
  "testdata/**",
  # Fuzz corpus entries. The Go fuzzing engine writes these itself, in its own
  # format, with no room for a comment, so they are licensed here rather than
  # inline. The glob is deliberate where the docs/ list above is deliberately
  # not: these files are MACHINE-written, one per finding, at a path the engine
  # chooses, so naming them individually would mean a failing input could not be
  # committed without also editing this file, and the failing input is the
  # evidence. See scripts/ci/fuzz-smoke.sh.
  "**/testdata/fuzz/**",
  "scripts/demo.sh",
  "scripts/license-check.sh",
  "scripts/verify-scene.sh",
  "scripts/demo/**",
  "scripts/stories/**",
  "docker/demo/**",
]
SPDX-FileCopyrightText = "2026 Gneiss Group Inc."
SPDX-License-Identifier = "Apache-2.0"

# perf/ is server-tier (its benchmarks import the AGPL enforcement engine), so its
# docs are annotated to match.
#
# docs/enrollment.md is the same case reached from the other direction: it
# documents `kessa-issuer enroll`, which is AGPL-tier, and it carries an
# AGPL-3.0-only header inline. The old `docs/*.md` glob claimed Apache-2.0 for it,
# so this file stated two different licences for one document. The inline header
# won under REUSE's precedence, so removing the glob changes no file's effective
# licence: it stops the repository stating a licence it never meant.
#
# The entry below agrees with that file's inline header rather than overriding it.
# Both say AGPL-3.0-only, which is redundant and deliberately so: the annotation
# records the tier decision next to perf/README.md's, where a reader looking for
# the AGPL-tier docs will find it.
[[annotations]]
path = ["perf/README.md", "docs/enrollment.md"]
SPDX-FileCopyrightText = "2026 Gneiss Group Inc."
SPDX-License-Identifier = "AGPL-3.0-only"

#
# Dependabot — keep the pinned GitHub Actions current.
#
# Every action in this repository's workflows is pinned to a full commit SHA
# (not a moving tag), which is the right supply-chain posture but freezes the
# action at that commit until someone bumps it. Dependabot is the other half of
# that trade: it opens a PR when a newer release exists, rewriting BOTH the SHA
# and the trailing `# vX.Y.Z` comment, so pinning does not rot into running
# indefinitely-old actions with unpatched bugs.
#
# Only the github-actions ecosystem is watched: the Go module set is standard
# library only (go.mod has no require block), so there is nothing for the gomod
# ecosystem to update. Add a gomod entry here the day the first dependency lands.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      # Match the repository's Conventional Commits convention (docs/branching.md)
      # so Dependabot's PRs flow through the same release-notes machinery.
      prefix: "build"
    groups:
      # One PR for all action bumps rather than a swarm of single-action PRs.
      github-actions:
        patterns: ["*"]
    labels:
      - dependencies

  # Base images in the release Dockerfiles are digest-pinned (golang, distroless);
  # this keeps those digests current the same way the pinned Actions stay current.
  - package-ecosystem: docker
    directories:
      - "/docker"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels:
      - dependencies

#
# Release, phase 1 of 2: PREPARE.
#
# A release lands on main the same way every other change does: through a pull
# request. Nothing pushes to main directly, so the branch ruleset needs no bypass
# for this workflow, and because the PR is squash-merged, the commit that lands is
# created and SIGNED by GitHub itself, which is how a "require signed commits"
# rule is satisfied without giving a runner a signing key.
#
# This phase is manual and restricted to a named release manager. It runs the
# full gate again, derives the
# next version, writes the version constant and the changelog, and pushes a
# `release/vX.Y.Z` branch. It does NOT open the PR (repository policy disables
# Actions-authored PRs), it prints the one-click "create PR" link instead. You
# open the PR, review it, and squash-merge it. Phase 2 (release-publish.yml) then
# tags, builds, signs, and publishes off the merged commit.
#
# `dry_run` (the default) does everything except push the branch: it shows the
# version it would cut and the notes it would write, and leaves the tree on the
# runner untouched upstream.

name: Release (prepare)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: auto derives it from the commits since the last tag"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      fixtures_reviewed:
        description: "I have reviewed the golden-fixture changes in this range (required only if a golden moved)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: compute the version and notes, but do not push the release branch"
        type: boolean
        default: true

# Read-only by default, so a job added to this file later starts with no write
# and has to ask. release-publish.yml is arranged the same way.
permissions:
  contents: read

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: verify, version, open release branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # Scoped to this job rather than the file: the only write this workflow
      # performs is pushing the release/* branch. It never writes main, which is
      # why the branch ruleset needs no bypass for it.
      contents: write

    steps:
      - name: Only a release manager prepares a release, and only from main
        env:
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          # Comma-separated logins permitted to cut a release.
          #
          # This was `github.actor != github.repository_owner`, which could never
          # pass: this repository is owned by an ORGANISATION, so that context is
          # "Gneiss-Group", and no user login ever equals it. The guard refused
          # every release including the owner's own. It failed closed, so nothing
          # shipped that should not have, but phase 1 could not run at all, and
          # because no release had ever been attempted, nothing surfaced it. Same
          # shape as the CLA workflow: a gate nobody could pass, invisible because
          # the path was never exercised.
          #
          # GitHub already limits workflow_dispatch to accounts with write access.
          # This list is the narrower question layered on top: of those accounts,
          # which may cut a release.
          RELEASE_MANAGERS: raphaelGneiss
        run: |
          # -x and -F: whole-line, fixed-string. A substring match would let
          # "raphtheb" satisfy a list containing "raphaelGneiss".
          if ! printf '%s' "$RELEASE_MANAGERS" | tr ',' '\n' | grep -qxF "$ACTOR"; then
            echo "::error::$ACTOR is not a release manager ($RELEASE_MANAGERS); releases are restricted."
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::releases are cut from main, not $REF."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the version bump, the fixture drift check, and
          # the notes are all derived from the range since the last tag.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gate (fmt, licence, vet, licence boundary, race tests, demo)
        run: scripts/ci/gate.sh

      - name: golden-fixture guard
        id: fixtures
        env:
          KESSA_FIXTURE_ACK: ${{ inputs.fixtures_reviewed }}
        run: bash scripts/release/fixture-guard.sh

      - name: derive the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          next="$(bash scripts/release/next-version.sh "$BUMP")"
          current="$(bash scripts/release/version.sh)"
          echo "current=$current" >>"$GITHUB_OUTPUT"
          echo "next=$next"       >>"$GITHUB_OUTPUT"
          echo "tag=v$next"       >>"$GITHUB_OUTPUT"
          echo "branch=release/v$next" >>"$GITHUB_OUTPUT"
          echo "### Preparing \`v$next\` (from \`$current\`)" >>"$GITHUB_STEP_SUMMARY"

      - name: a moved golden is never a patch release
        env:
          CHANGED: ${{ steps.fixtures.outputs.fixtures_changed }}
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          changed="$CHANGED"; current="$CURRENT"; next="$NEXT"
          if [ "$changed" = "true" ] && [ "${current%.*}" = "${next%.*}" ]; then
            echo "::error::a golden fixture changed, so $next cannot be a patch release. Re-run with bump=minor (or major, at >=1.0) and describe the format change in the notes."
            exit 1
          fi

      - name: write the version and the changelog on a signed release branch
        env:
          NEXT: ${{ steps.version.outputs.next }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
          DRY: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          bash scripts/release/notes.sh "$NEXT" "$prev" >/tmp/notes.md
          cat /tmp/notes.md >>"$GITHUB_STEP_SUMMARY"

          bash scripts/release/version.sh "$NEXT"
          bash scripts/release/changelog.sh /tmp/notes.md

          # Re-check house style now that the changelog EXISTS. The gate above ran
          # before this file was written, so it could say nothing about it, and a
          # generated changelog that breaks the rule would otherwise sail past here
          # and fail on the release PR, where the gate is a required check. That
          # leaves a release that cannot merge and cannot be fixed without hand
          # editing generated output. Validate before the side effect, and the side
          # effect here is the push below, not the generation above.
          #
          # notes.sh already normalises subjects lifted from commit messages, which
          # is the known cause. This is the check that the cause was the only one.
          bash scripts/ci/prose-check.sh

          changed="$(git diff --name-only -- internal/version/version.go CHANGELOG.md)"
          if [ -z "$changed" ]; then
            echo "::error::nothing to commit: the source already carries $NEXT and CHANGELOG is up to date."
            exit 1
          fi

          if [ "$DRY" = "true" ]; then
            {
              echo
              echo "> **Dry run.** Computed \`$TAG\` and wrote the bump on the runner, but pushed nothing."
              echo "> Files that would be committed: $(echo $changed | tr '\n' ' ')"
              echo "> Re-run with \`dry_run\` unchecked to push \`$BRANCH\` and get the PR link."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The commit is created through the API, NOT with `git commit` and a
          # push, and that is the whole point: main requires signed commits, and a
          # runner deliberately holds no signing key. A commit created through
          # createCommitOnBranch is signed by GitHub itself, so the release branch
          # satisfies the rule without a key ever existing on the runner.
          #
          # This is what blocked v0.0.1. The original design assumed the eventual
          # squash-merge commit being GitHub-signed was enough, but the ruleset
          # also evaluates the commits being merged, so an unsigned commit on the
          # release branch blocks the merge before any squash happens.
          #
          # The branch is created at the checked-out commit only when it does not
          # already exist, and an existing branch is committed ON TOP of rather
          # than reset. Resetting a branch to its base leaves a moment where head
          # equals base, and GitHub auto-closes any open pull request when that
          # happens. Stacking is harmless here because the pull request is
          # squash-merged: the subject that lands comes from the PR title, not
          # from these commits. To start a version genuinely clean, delete the
          # release branch first.
          base_oid="$(git rev-parse HEAD)"
          head_oid="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null || true)"
          if [ -z "$head_oid" ]; then
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$base_oid" >/dev/null
            head_oid="$base_oid"
          fi

          additions="$(for f in $changed; do
            jq -n --arg p "$f" --arg c "$(base64 -w0 "$f")" '{path:$p, contents:$c}'
          done | jq -s '.')"

          # The subject IS the marker phase 2 keys off (release-publish.yml), and
          # it is also the pre-filled PR title, so the squash-merge commit carries
          # it onto main. GitHub appends " (#N)" to a squash subject; phase 2's
          # pattern allows that suffix.
          jq -n --arg repo "$REPO" --arg branch "$BRANCH" --arg oid "$head_oid" \
                --arg headline "build(release): $TAG" --argjson additions "$additions" \
            '{query:"mutation($input: CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
              variables:{input:{branch:{repositoryNameWithOwner:$repo, branchName:$branch},
                                message:{headline:$headline},
                                expectedHeadOid:$oid,
                                fileChanges:{additions:$additions}}}}' >/tmp/commit.json

          new_oid="$(gh api graphql --input /tmp/commit.json --jq '.data.createCommitOnBranch.commit.oid')"
          echo "created $new_oid on $BRANCH"

          # A signed commit is the entire reason for the API path, so confirm it
          # rather than assume it. An unsigned commit here would block the merge.
          verified="$(gh api "repos/$REPO/commits/$new_oid" --jq '.commit.verification.verified')"
          if [ "$verified" != "true" ]; then
            reason="$(gh api "repos/$REPO/commits/$new_oid" --jq '.commit.verification.reason')"
            echo "::error::$new_oid is not signed (reason: $reason); main requires signed commits, so this branch could not be merged."
            exit 1
          fi
          echo "signature verified on $new_oid"

      - name: the one-click PR link
        if: ${{ !inputs.dry_run }}
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # Pre-fill the PR title with the marker subject so the squash-merge
          # commit that lands on main carries it (phase 2 detects on it).
          title="build(release): $TAG"
          enc_title="$(printf '%s' "$title" | sed 's/ /%20/g; s/(/%28/g; s/)/%29/g; s/:/%3A/g')"
          url="$REPO/compare/main...$BRANCH?expand=1&title=$enc_title"
          {
            echo "## Release $TAG is ready to open"
            echo
            echo "1. **[Open the release PR]($url)** (title is pre-filled with the marker subject: keep it)."
            echo "2. Let CI pass, then **squash-merge** it. GitHub signs the squash commit, satisfying the signed-commits rule."
            echo "3. Phase 2 (**Release (publish)**) fires on the merge: it tags \`$TAG\`, builds the signed artifacts, and publishes the release."
          } >>"$GITHUB_STEP_SUMMARY"

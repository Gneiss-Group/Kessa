#
# CI: the gate every change passes before it can be merged, and the same gate
# the release workflow runs again before it tags anything.
#
# The checks are the ones CONTRIBUTING.md already names as the ground rules, run
# by the same Makefile targets a contributor runs locally, so CI cannot drift
# into testing something different from what the docs promise. Nothing here
# releases, publishes, or writes to the repository; `permissions: contents: read`
# makes that structural rather than a matter of trust.
#
# Every third-party action is pinned to a full commit SHA, not a moving major
# tag: a tag is a pointer the action's owner can repoint, which is a supply-chain
# edge in a repository whose whole subject is not trusting the party that produced
# an artifact. The trailing `# vX.Y.Z` comment is the human-readable version, and
# Dependabot (.github/dependabot.yml) bumps both the SHA and the comment together.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Credential scanning is its own job so it is an independent, required status
  # check: a green build must never be able to carry a committed secret. The scan
  # logic lives in scripts/ci/secret-scan.sh and is driven by the
  # version-controlled .gitleaks.toml, so the Codeberg mirror runs the exact same
  # gate by calling the same script: nothing here depends on a GitHub-only
  # scanning feature.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # gitleaks is built from source at a pinned version by the script,
          # using this toolchain: no prebuilt scanner binary is trusted.
          go-version-file: go.mod
          cache: true

      - name: scan for committed credentials
        run: scripts/ci/secret-scan.sh

  # The container images get their own job for the same reason the secret scan
  # does: it is an independent status check, and its dependency (a Docker daemon)
  # must not leak into scripts/ci/gate.sh, which is deliberately Go-only so the
  # Codeberg mirror and a laptop can both run it.
  #
  # It is here rather than on a schedule because of what it caught. The proxy
  # image's CMD could not start at all, and had not been able to for months,
  # because nothing ever ran it: docker/demo.sh builds the same image and then
  # exercises `run`, never `serve`. A check that only runs weekly would have been a
  # slower version of the same blind spot. It runs concurrently with `check`, whose
  # gate is the long pole, so it costs no wall-clock on the critical path.
  container-smoke:
    name: container images serve (proxy CMD, both listeners)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: proxy image starts from its own CMD and both listeners answer
        run: scripts/ci/container-smoke.sh

  check:
    name: build, vet, race tests, licence boundary, demo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The toolchain comes from go.mod, so the version this repository
          # builds with is stated in exactly one place.
          go-version-file: go.mod
          cache: true

      - name: gate (fmt, licence, vet, licence boundary, race tests, demo)
        # The shared gate: the same script the two release phases run, so CI and
        # release cannot check different things. See scripts/ci/gate.sh.
        run: scripts/ci/gate.sh

      # ---- CI-only extras beyond the shared gate --------------------------

      # There is deliberately NO fuzz step here, and the absence is worth a note
      # because it looks like an omission.
      #
      # `go test` runs a fuzz target's seed corpus as ordinary subtests whenever
      # -fuzz is absent, so the race-test step inside the gate above ALREADY
      # compiles every target and executes every seed, including every committed
      # regression seed from `testdata/fuzz/`. Both things a liveness check would
      # assert, that the targets still build and their corpora still load, are
      # therefore already asserted, and every defect a past campaign found is
      # re-checked on every pull request.
      #
      # A `-fuzz` step here would add only random exploration. Ten seconds of it
      # is noise, minutes of it does not belong between writing a change and
      # merging it, and it was two thirds of this job's runtime. Discovery moved
      # to fuzz.yml, on a schedule, with a budget worth having.

      - name: build every binary
        run: make build

      - name: --version answers without running anything
        run: |
          for b in kessa kessa-shadow kessa-issuer kessa-proxy kessa-agent; do
            out="$(./bin/$b --version)"
            echo "$out"
            case "$out" in
              "$b "*) ;;
              *) echo "::error::$b --version did not identify itself as $b"; exit 1 ;;
            esac
          done

      - name: fixtures reproduce from source
        # A golden that cannot be regenerated byte-for-byte from this source is
        # a golden somebody edited by hand, which is indistinguishable from a
        # tampered one. The release workflow checks this again, with more.
        run: |
          make fixtures
          git diff --exit-code -- testdata/

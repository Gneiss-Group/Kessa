#
# CLA: every external contributor signs before their code can be merged.
#
# Kessa's AGPL core is also offered under a separate commercial licence, and that
# is not something the project can do with contributed code unless the contributor
# has granted the right in writing. CLA.md is that grant; this workflow is what
# makes it a gate rather than an honour system.
#
# Why an Action rather than a hosted CLA service: counsel approved either, and
# this repository already decided the question for third-party tooling in
# scripts/ci/secret-scan.sh, which builds its scanner from pinned source rather
# than downloading a binary. A hosted service would put contributor identity and
# signature records with a processor we do not control. Here the signatures live
# in this repository, in .github/cla/signatures.json, and the only dependency is
# an Action pinned by SHA like every other one.
#
# Counsel's note on validity, recorded because it is the reason this is
# sufficient: under the Electronic Transactions Act (British Columbia), an
# electronic signature needs intent to sign and association with the record. A
# contributor commenting the agreed phrase, together with their authenticated
# GitHub identity and the commit SHA it is recorded against, satisfies both.

name: CLA

on:
  # issue_comment is how a contributor signs: they reply to the bot's comment.
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: has this contributor signed?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip the bot's own comments, and every comment that is not the signature
    # phrase, so an ordinary review conversation does not spin this up.
    if: >
      (github.event.issue.pull_request && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
      || github.event_name == 'pull_request_target'
    permissions:
      contents: write        # write the signature file
      pull-requests: write   # comment on the pull request and set its status
      actions: write         # re-run the blocked check once a signature lands
    steps:
      - name: check or record the signature
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures live in this repository. Nothing leaves it.
          path-to-signatures: .github/cla/signatures.json
          path-to-document: https://github.com/Gneiss-Group/Kessa/blob/main/CLA.md
          branch: main
          allowlist: dependabot[bot]
          # The phrase a contributor comments to sign. Counsel's requirement is
          # intent plus association; a fixed phrase is the intent half.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >
            Thank you for the contribution. Before it can be merged, please read
            [`CLA.md`](https://github.com/Gneiss-Group/Kessa/blob/main/CLA.md) and
            sign by posting the comment below.


            Kessa's core is `AGPL-3.0-only` and is also offered commercially, so we
            need your explicit permission to distribute your contribution under
            those separate terms. You keep ownership of your work; this is a
            licence grant, not an assignment. If you are contributing on behalf of
            an employer, see
            [`CLA-CORPORATE.md`](https://github.com/Gneiss-Group/Kessa/blob/main/CLA-CORPORATE.md).
          custom-allsigned-prcomment: >
            All contributors have signed the CLA. Thank you.

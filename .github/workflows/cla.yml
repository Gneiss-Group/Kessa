#
# CLA: every external contributor signs before their code can be merged.
#
# Kessa's AGPL core is also offered under a separate commercial licence, and that
# is not something the project can do with contributed code unless the contributor
# has granted the right in writing. CLA.md is that grant; this workflow is what
# makes it a gate rather than an honour system.
#
# Why an Action rather than a hosted CLA service: this repository already decided
# the question for third-party tooling in scripts/ci/secret-scan.sh, which builds
# its scanner from pinned source rather than downloading a binary. A hosted service
# would put contributor identity and signature records with a processor we do not
# control. Here the signatures live in this repository, on the cla-signatures
# branch, and the only dependency is an Action pinned by SHA like every other one.
#
# What a recorded signature consists of, since that is what the rest of this file
# is arranged to produce: a deliberate act by the contributor (posting a fixed
# phrase, not merely opening a pull request), tied to an authenticated GitHub
# identity and to the specific pull request it was given against.

name: CLA

on:
  # issue_comment is how a contributor signs: they reply to the bot's comment.
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: has this contributor signed?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip the bot's own comments, and every comment that is not the signature
    # phrase, so an ordinary review conversation does not spin this up.
    if: >
      (github.event.issue.pull_request && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
      || github.event_name == 'pull_request_target'
    permissions:
      contents: write        # write the signature file
      pull-requests: write   # comment on the pull request and set its status
      actions: write         # re-run the blocked check once a signature lands
    steps:
      - name: check or record the signature
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures live in this repository. Nothing leaves it.
          path-to-signatures: signatures.json
          path-to-document: https://github.com/Gneiss-Group/Kessa/blob/main/CLA.md
          # NOT main, and this is load-bearing rather than tidiness. main's ruleset
          # requires signed commits and forbids direct pushes (docs/branching.md),
          # both of which a signature write would violate: the Action pushes
          # directly, and a runner has no signing key. Pointed at main, every
          # signature silently fails to record.
          #
          # The alternative was a ruleset bypass for this workflow. That trades a
          # standing hole in main's protection for a convenience, on a repository
          # whose release process is built specifically so that no bypass is
          # needed. A dedicated branch costs nothing by comparison.
          #
          # cla-signatures is an orphan branch holding signatures.json and nothing
          # else. It is not a source branch, is never merged, and its history is
          # the signature record.
          branch: cla-signatures
          allowlist: dependabot[bot]
          # The phrase a contributor comments to sign. Fixed and explicit on
          # purpose: signing has to be a deliberate act, distinguishable from any
          # other comment they might leave on the pull request.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >
            Thank you for the contribution. Before it can be merged, please read
            [`CLA.md`](https://github.com/Gneiss-Group/Kessa/blob/main/CLA.md) and
            sign by posting the comment below.


            Kessa's core is `AGPL-3.0-only` and is also offered commercially, so we
            need your explicit permission to distribute your contribution under
            those separate terms. You keep ownership of your work; this is a
            licence grant, not an assignment. If you are contributing on behalf of
            an employer, see
            [`CLA-CORPORATE.md`](https://github.com/Gneiss-Group/Kessa/blob/main/CLA-CORPORATE.md).
          custom-allsigned-prcomment: >
            All contributors have signed the CLA. Thank you.

#
# GitHub secret scanning — path exclusions.
#
# This configures GitHub's *native* secret scanning, which runs automatically on
# public repositories and cannot read our .gitleaks.toml. It is the second layer:
# the portable, forge-independent gate is scripts/ci/secret-scan.sh driven by
# .gitleaks.toml, which also covers the Codeberg mirror. This file only keeps
# GitHub's own scanner from re-raising the deliberate demo material that gitleaks
# already allowlists.
#
# Everything excluded here is enumerated in SECURITY.md under "Committed demo
# material": fixed Ed25519 seeds, patterned macaroon root keys, and published
# public keys — none of it a real credential. The exclusions are kept narrow and
# path-scoped so a real secret committed anywhere else is still caught.
#
# Note: paths-ignore only silences GitHub's native scanner. It does not weaken the
# gitleaks gate, which is where a genuinely misplaced secret would be caught first.

paths-ignore:
  - "examples/**"
  - "scripts/demo/**"
  - "scripts/stories/**"
  - "testdata/**"
  - "internal/enforce/enforce_test.go"
